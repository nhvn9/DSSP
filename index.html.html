<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Danh sách sản phẩm</title>
  <style>
    :root {
      --bg: #f2f5f7;
      --surface: #ffffff;
      --ink: #17262e;
      --muted: #5b6b74;
      --line: #d5dde2;
      --accent: #0b6e69;
      --danger: #b3261e;
      --danger-bg: #fdecea;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }
    .wrap { max-width: 960px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { margin: 0 0 4px; font-size: 1.75rem; }
    .sub { margin: 0 0 24px; color: var(--muted); }

    /* Ô tìm kiếm */
    .search { display: flex; gap: 8px; margin-bottom: 12px; }
    .search input {
      flex: 1;
      padding: 12px 14px;
      font-size: 1rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
    }
    .search input:focus-visible,
    .search button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .search button {
      padding: 0 18px;
      font-size: 1rem;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }

    .status { min-height: 1.5em; margin: 0 0 16px; color: var(--muted); font-size: 0.95rem; }
    .error {
      padding: 14px 16px;
      border-radius: 8px;
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    /* Lưới sản phẩm responsive bằng CSS Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .card .cat { font-size: 0.85rem; color: var(--muted); }
    .card h2 { margin: 0; font-size: 1.1rem; }
    .card .price { margin-top: auto; padding-top: 8px; font-weight: 600; color: var(--accent); }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Danh sách sản phẩm</h1>
    <p class="sub">Gõ tên sản phẩm để lọc, không cần gõ đúng hoa thường hay dấu.</p>

    <div class="search" role="search">
      <input id="searchInput" type="search" maxlength="50"
             placeholder="Ví dụ: laptop, chuot, tai nghe" aria-label="Tìm theo tên sản phẩm" autocomplete="off">
      <button id="clearBtn" type="button">Xóa</button>
    </div>

    <p id="status" class="status" aria-live="polite"></p>
    <section id="list" class="grid" aria-label="Kết quả"></section>
  </main>

  <script>
    // 1. Dữ liệu: mảng sản phẩm
    const products = [
      { id: 1, name: "Laptop Dell Inspiron 15", category: "Máy tính",  price: 15990000 },
      { id: 2, name: "Chuột không dây Logitech", category: "Phụ kiện", price: 350000 },
      { id: 3, name: "Bàn phím cơ Keychron K2",  category: "Phụ kiện", price: 1890000 },
      { id: 4, name: "Tai nghe Sony WH-1000XM5", category: "Âm thanh", price: 7490000 },
      { id: 5, name: "Màn hình LG 27 inch",      category: "Màn hình", price: 4590000 },
      { id: 6, name: "Điện thoại Samsung Galaxy A55", category: "Điện thoại", price: 9990000 },
      { id: 7, name: "Loa Bluetooth JBL Flip 6", category: "Âm thanh", price: 2490000 }
    ];

    // 2. Chuẩn hóa chuỗi: bỏ khoảng trắng thừa, hạ chữ thường, bỏ dấu tiếng Việt
    function normalize(text) {
      return String(text)
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/đ/g, "d")
        .replace(/\s+/g, " ");
    }

    // Tính sẵn khóa tìm kiếm MỘT LẦN, mỗi lần gõ chỉ so sánh, không chuẩn hóa lại
    products.forEach(p => { p.searchKey = normalize(p.name); });

    const listEl = document.getElementById("list");
    const statusEl = document.getElementById("status");
    const inputEl = document.getElementById("searchInput");
    const clearBtn = document.getElementById("clearBtn");

    const formatPrice = n => n.toLocaleString("vi-VN") + " đ";

    // 3. Hiển thị: dùng createElement + textContent, KHÔNG dùng innerHTML
    function render(items, rawQuery) {
      listEl.replaceChildren();
      statusEl.replaceChildren();
      statusEl.className = "status";

      if (items.length === 0) {
        const msg = document.createElement("div");
        msg.className = "error";
        msg.textContent = 'Không tìm thấy sản phẩm nào phù hợp với "' + rawQuery + '".';
        statusEl.className = "";
        statusEl.appendChild(msg);
        return;
      }

      statusEl.textContent = "Hiển thị " + items.length + " / " + products.length + " sản phẩm.";

      const frag = document.createDocumentFragment();
      items.forEach(p => {
        const card = document.createElement("article");
        card.className = "card";

        const cat = document.createElement("span");
        cat.className = "cat";
        cat.textContent = p.category;

        const title = document.createElement("h2");
        title.textContent = p.name;

        const price = document.createElement("span");
        price.className = "price";
        price.textContent = formatPrice(p.price);

        card.append(cat, title, price);
        frag.appendChild(card);
      });
      listEl.appendChild(frag);
    }

    // 4. Tìm kiếm
    function search() {
      const rawQuery = inputEl.value.trim();
      const key = normalize(rawQuery);
      const result = key === ""
        ? products
        : products.filter(p => p.searchKey.includes(key)); // includes: so khớp chuỗi thuần, không dùng RegExp
      render(result, rawQuery);
    }

    // Debounce: đợi người dùng ngừng gõ 200ms rồi mới lọc
    let timer;
    inputEl.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(search, 200);
    });

    clearBtn.addEventListener("click", () => {
      inputEl.value = "";
      search();
      inputEl.focus();
    });

    search(); // hiển thị toàn bộ khi mở trang
  </script>
</body>
</html>
